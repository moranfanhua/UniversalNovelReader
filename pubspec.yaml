name: unr
description: 跨平台 EPUB 与网络小说阅读器
publish_to: none
version: 0.3.1+3
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.7
  uuid: ^4.5.3
  html: ^0.15.6
  archive: ^4.0.9
  xml: ^6.6.1
  file_picker: ^12.0.0
  flutter_secure_storage: ^10.3.1
  enough_convert: ^1.6.0
  path_provider: ^2.1.6
  flutter_svg: ^2.3.0
  pointycastle: ^4.0.0
  pinyin: ^3.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/sfacg_cipher.json
    - assets/fanqie_cipher.json
    - assets/sfacg_icon.jpg
    - assets/fanqie_icon.webp
