name: Build Checks

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/**'
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    branches: [dev, master]
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/**'
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows x64 debug
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - run: flutter build windows --debug --no-pub
      - name: Upload complete Windows bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unr-windows-debug
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android debug
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: ./.github/actions/setup-flutter
      # Flutter 构建先生成未入库的 Gradle wrapper 和 local.properties。
      # 调试签名由 runner 生成，不读取正式发布密钥。
      - run: flutter build apk --debug --no-pub
      - name: Upload Android debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unr-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
