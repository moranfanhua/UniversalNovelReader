name: Stable branch policy

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  statuses: write

jobs:
  dev-to-master:
    name: Validate dev to master
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # 仅使用默认分支中的校验代码与 GitHub 事件元数据，不检出或执行 PR 代码。
      # 状态明确写到 PR 的 head SHA，避免 pull_request_target 的 base SHA 混淆。
      - uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const allowed = pr.base.ref === 'master'
              && pr.head.ref === 'dev'
              && pr.head.repo?.id === context.payload.repository.id;
            const description = allowed
              ? '允许本仓库 dev → master 的 PR'
              : 'master 仅接收本仓库 dev 分支的 PR';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              context: 'dev-to-master',
              state: allowed ? 'success' : 'failure',
              description,
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!allowed) core.setFailed(description);
